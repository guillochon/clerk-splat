street: el_cajon_blvd
workspace: ./workspace

discover:
  # Title keywords; a video matches if ANY keyword appears (case-insensitive)
  keywords: ["el cajon blvd", "el cajon boulevard", "el cajon bl"]
  # City Clerk Digital Archives street-video index (paginated with ?page=N)
  archive_url: https://www.sandiego.gov/digitalarchives/film-audio/street-videos
  archive_max_pages: 400   # index had 352 pages (0-351) in Oct 2026
  # Fallback: YouTube search via yt-dlp (no API key needed)
  youtube_search: "San Diego City Clerk street view El Cajon"
  youtube_search_limit: 50

download:
  format: "bv*[height<=1080]/b"   # video only is fine; audio is useless here

frames:
  fps: 6                 # candidate extraction rate before filtering
  crop_border_px: 12     # trims film-gate edges / scan borders
  crop_bottom_px: 90     # removes the burned-in "EL CAJON BL E/B" caption bar (480p uploads)
  auto_crop_black: true  # detect and remove letterbox / pillarbox
  sharpness_window: 1    # keep sharpest frame in each window of N candidates
                         # (1 for these reels: they're time-lapse, 6 unique film frames/s
                         # held 5 video frames each — fps: 6 already lands one per film frame)
  min_flow_px: 4.0       # drop frames where the car barely moved (stopped at lights)
  max_frames: 600        # per segment; COLMAP gets slow beyond this

mask:
  enabled: true
  model: .tools/yolo/yolov8x-seg.pt
  classes: [person, bicycle, car, motorcycle, bus, truck]
  dilate_px: 9
  mask_bottom_frac: 0.0  # set e.g. 0.12 if the survey car's hood is visible
  keep_static: true      # `moving` stage (after sfm): unmask parked cars / standing people in
                         # masks/ so they stay in the splat; only traffic stays masked
  static_reach: 3        # neighbouring frames each side used for the parked-or-moving test
  static_iou: 0.3

sky:
  enabled: false         # adds SegFormer (ADE20K) sky to masks/ so Brush doesn't model it
  model: nvidia/segformer-b5-finetuned-ade-640-640   # b2 ate pale facades and signs
  min_prob: 0.9
  dilate_px: 0

sfm:
  camera_model: SIMPLE_RADIAL  # OPENCV has too many free params for 480p film scans
  features: aliked       # aliked (ALIKED+LightGlue, COLMAP>=4; needs CUDA 12 DLLs on PATH) | sift
  single_camera: true    # one camera per reel
  matcher: sequential    # forward-driving footage
  overlap: 15
  cross_stride: 3        # multi-reel segments: match each frame to every Nth frame of the other reel
  cross_min_inliers: 100 # drop weaker cross-reel links (false matches top out ~60; true
                         # neighbours ~160). EB vs WB of ECB: none survive — opposite-direction
                         # 480p views don't match, so reels stay separate models
  vocab_tree: ""         # optional path for loop detection
  mapper: colmap         # auto = glomap if installed, else colmap
                         # (incremental beat global mapping on the ECB EB test: global
                         # scrambled frame order along the street)

dense:
  enabled: true          # COLMAP PatchMatch MVS -> Brush init points (+1.2 dB held-out on ECB EB)
  max_points: 400000     # voxel-thinned to at most this many

train:
  brush_bin: .tools/brush/brush_app.exe   # github.com/ArthurBrussee/brush releases
  # Tuned on ECB EB (held-out frames + off-path renders): 30k steps scored lower and grew
  # more sky streaks than 15k; SH degree 1 matched SH3 on held-out views with a cleaner sky
  # and a file ~3x smaller per splat. Opacity+scale losses didn't help; with dense init a
  # 1M splat cap scored within 0.04 dB of uncapped (1.9M) at half the file size.
  max_iters: 15000
  export_every: 15000
  brush_args: ["--sh-degree", "1", "--max-splats", "1000000"]   # cap: -0.04 dB, half the file
